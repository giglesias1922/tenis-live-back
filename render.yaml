# Render Blueprint: https://render.com/docs/blueprint-spec
# Use this to create a Web Service + PostgreSQL from the dashboard (New > Blueprint).

services:
  - type: web
    name: tenis-live-back
    runtime: node
    region: oregon

    buildCommand: npm install && npm run build
    startCommand: npm start
    releaseCommand: npm run release

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tenis-live-db
          property: connectionString

databases:
  - name: tenis-live-db
    plan: free
    databaseName: tenis_live
    user: tenis_live
